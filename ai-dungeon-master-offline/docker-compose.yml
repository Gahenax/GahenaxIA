version: '3.8'

services:
  # 1. El motor de inferencia local (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: cripta-ollama
    ports:
      - "11434:11434"
    volumes:
      - c:/Users/jotam/.ollama:/root/.ollama
    restart: unless-stopped

  # 2. El backend secundario de Cripta (FastAPI)
  cripta-backend:
    build:
      context: ./app/sidecar
      dockerfile: Dockerfile
    container_name: cripta-backend
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    volumes:
      - ./app/data:/app/data
      - ./app/sidecar/python:/app/sidecar/python
    environment:
      - LLM_PROVIDER=ollama
      - LLM_HOST=http://ollama:11434
      - LLM_MODEL=qwen2.5:3b
    restart: unless-stopped

