version: '3.8'

services:
  # 1. El motor de inferencia local (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: cripta-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  # 2. Descarga automática del modelo Qwen al primer arranque
  ollama-helper:
    image: curlimages/curl:latest
    container_name: cripta-ollama-helper
    depends_on:
      - ollama
    entrypoint: [ "sh", "-c", "sleep 5 && curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5:1.5b\"}'" ]

  # 3. El backend secundario de Cripta (FastAPI)
  cripta-backend:
    build:
      context: ./app/sidecar
      dockerfile: Dockerfile
    container_name: cripta-backend
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    volumes:
      - ./app/data:/app/data
      - ./app/sidecar/python:/app/sidecar/python
    environment:
      - LLM_PROVIDER=ollama
      - LLM_HOST=http://ollama:11434
      - LLM_MODEL=qwen2.5:1.5b
    restart: unless-stopped

volumes:
  ollama-data:
    name: cripta-ollama-data
